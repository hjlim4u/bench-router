[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-router"
version = "0.0.0"
description = "Benchmark-evidence router for coding-agent profiles"
requires-python = ">=3.11"
dependencies = []  # core path is stdlib only

[project.optional-dependencies]
arena = ["pyarrow"]  # needed only for `refresh --source arena`

[project.scripts]
bench-router = "bench_router.cli:main"

[tool.setuptools]
packages = ["bench_router"]

[tool.setuptools.package-data]
bench_router = ["*.toml", "index.json", "defaults/*.toml"]
