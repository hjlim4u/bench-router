<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1.5; }
      .header { fill: #161b22; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: bold; }
      .dim { fill: #8b949e; }
      .green { fill: #3fb950; font-weight: bold; }
      .yellow { fill: #d29922; }
      .cyan { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
      .badge-bg { fill: #1f2937; stroke: #3fb950; stroke-width: 1; rx: 4px; }

      .step1, .step2, .step3, .step4 { opacity: 0; }
      .step1 { animation: fade1 14s infinite; }
      .step2 { animation: fade2 14s infinite; }
      .step3 { animation: fade3 14s infinite; }
      .step4 { animation: fade4 14s infinite; }

      @keyframes fade1 {
        0%, 3% { opacity: 0; }
        6%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade2 {
        0%, 15% { opacity: 0; }
        19%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade3 {
        0%, 45% { opacity: 0; }
        49%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade4 {
        0%, 62% { opacity: 0; }
        66%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .step1, .step2, .step3, .step4 { animation: none; opacity: 1; }
      }
    </style>
    <clipPath id="window-clip">
      <rect x="0" y="0" width="860" height="450" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Window background -->
    <rect class="bg" x="0" y="0" width="860" height="450"/>
    <!-- Title bar -->
    <rect class="header" x="0" y="0" width="860" height="36"/>
    <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text class="title" x="430" y="22">vendor-guided policy 6 · synthetic summary · BR="python3 -m bench_router.cli"</text>

    <!-- Step 1: explain command -->
    <g class="step1">
      <text class="code" x="24" y="68">
        <tspan class="prompt">$</tspan>
        <tspan class="cmd"> $BR evaluate --format 3 --task task.json --decision-response responses.json</tspan>
      </text>
    </g>

    <!-- Step 2: explain output -->
    <g class="step2">
      <text class="code dim" x="24" y="94">completed analysis → vendor guidance → benchmark relevance · schema 4.0 · status ok</text>
      <text class="code" x="24" y="116">
        <tspan class="dim">recommendation:</tspan> <tspan class="cyan">abstained</tspan> <tspan class="dim">· upstream_selection_required</tspan>
      </text>
      <text class="code" x="24" y="138">
        <tspan class="dim">evidence:</tspan> <tspan class="green">comparable raw observations</tspan> <tspan class="purple">· no combined ranking</tspan>
      </text>
      <text class="code dim" x="24" y="162">candidates:</text>
      <text class="code" x="24" y="184">
        <tspan class="cyan">    claude-opus-high</tspan><tspan>: eligible=true · suitability=documented</tspan>
      </text>
      <text class="code dim" x="24" y="204">      observations · missing · diagnostics preserved per candidate</text>
      <text class="code" x="24" y="226">
        <tspan class="green">    codex-sol-high</tspan><tspan>: eligible=true · suitability=documented</tspan>
      </text>
      <text class="code dim" x="24" y="246">upstream choice → select (policy + reason) → selection.json (schema 6.0)</text>
    </g>

    <!-- Step 3: route command -->
    <g class="step3">
      <text class="code" x="24" y="286">
        <tspan class="prompt">$</tspan>
        <tspan class="cmd"> $BR --herdr-session work route --task task.json --selection selection.json</tspan>
      </text>
    </g>

    <!-- Step 4: route JSON output -->
    <g class="step4">
      <text class="code" x="24" y="314">{</text>
      <text class="code" x="40" y="334">
        <tspan class="cyan">"status"</tspan>: <tspan class="green">"completed"</tspan>,
        <tspan class="cyan">"selection_mode"</tspan>: <tspan class="purple">"orchestrator_assessed"</tspan>,
      </text>
      <text class="code" x="40" y="354">
        <tspan class="cyan">"selected"</tspan>: { <tspan class="cyan">"profile"</tspan>: <tspan class="green">"codex-sol-high"</tspan>, … },
      </text>
      <text class="code" x="40" y="374">
        <tspan class="cyan">"run_id"</tspan>: <tspan class="yellow">"r-synthetic-001"</tspan>,
        <tspan class="cyan">"branch"</tspan>: <tspan class="yellow">"work/br-r-synthetic-001"</tspan>,
      </text>
      <text class="code" x="40" y="394">
        <tspan class="cyan">"result_path"</tspan>: <tspan class="yellow">"/project/.bench-router/runs/…/result.md"</tspan>, …
      </text>
      <text class="code" x="24" y="414">}</text>

      <rect class="badge-bg" x="595" y="400" width="240" height="28"/>
      <text class="code green" x="610" y="419">✓ 결과 계약 및 SHA-256 검증 통과</text>
    </g>
  </g>
</svg>
