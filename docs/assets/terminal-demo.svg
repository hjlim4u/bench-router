<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1.5; }
      .header { fill: #161b22; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; font-weight: bold; }
      .dim { fill: #8b949e; }
      .green { fill: #3fb950; font-weight: bold; }
      .yellow { fill: #d29922; }
      .cyan { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
      .badge-bg { fill: #1f2937; stroke: #3fb950; stroke-width: 1; rx: 4px; }

      .step1, .step2, .step3, .step4 { opacity: 0; }
      .step1 { animation: fade1 14s infinite; }
      .step2 { animation: fade2 14s infinite; }
      .step3 { animation: fade3 14s infinite; }
      .step4 { animation: fade4 14s infinite; }

      @keyframes fade1 {
        0%, 3% { opacity: 0; }
        6%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade2 {
        0%, 15% { opacity: 0; }
        19%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade3 {
        0%, 45% { opacity: 0; }
        49%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes fade4 {
        0%, 62% { opacity: 0; }
        66%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .step1, .step2, .step3, .step4 { animation: none; opacity: 1; }
      }
    </style>
    <clipPath id="window-clip">
      <rect x="0" y="0" width="860" height="450" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Window background -->
    <rect class="bg" x="0" y="0" width="860" height="450"/>
    <!-- Title bar -->
    <rect class="header" x="0" y="0" width="860" height="36"/>
    <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text class="title" x="430" y="22">bench-router — explain &amp; route workflow (synthetic demo)</text>

    <!-- Step 1: explain command -->
    <g class="step1">
      <text class="code" x="24" y="68">
        <tspan class="prompt">$</tspan>
        <tspan class="cmd"> python3 -m bench_router.cli explain --task task.json</tspan>
      </text>
    </g>

    <!-- Step 2: explain output -->
    <g class="step2">
      <text class="code dim" x="24" y="94">task synthetic-smoke-001 round 1 · policy 1.0 · snapshot 3fbd7f55...4eac</text>
      <text class="code" x="24" y="116">
        <tspan class="dim">classification:</tspan> <tspan class="cyan">L0 {'analysis': 1.0}</tspan> <tspan class="dim">confidence=0.9 · priority=balanced (λ=0.15)</tspan>
      </text>
      <text class="code" x="24" y="138">
        <tspan class="dim">selected:</tspan> <tspan class="green">codex-sol-high</tspan> <tspan class="purple">(benchmark_score)</tspan>
      </text>
      <text class="code dim" x="24" y="162">candidates:</text>
      <text class="code" x="24" y="184">
        <tspan class="green">  ▶ codex-sol-high</tspan><tspan>:   score=</tspan><tspan class="green">0.777</tspan><tspan>  quality=0.852  coverage=1.0 (sufficient)  cost_proxy=0.5</tspan>
      </text>
      <text class="code dim" x="24" y="204">      aa_intelligence w=0.6 norm=0.86 · arena_text w=0.4 norm=0.84 (scope=model_proxy)</text>
      <text class="code" x="24" y="226">
        <tspan class="cyan">    claude-opus-high</tspan><tspan>: score=0.754  quality=</tspan><tspan class="cyan">0.904</tspan><tspan>  coverage=1.0 (sufficient)  cost_proxy=1.0</tspan>
      </text>
      <text class="code dim" x="24" y="246">      aa_intelligence w=0.6 norm=0.92 · arena_text w=0.4 norm=0.88 (scope=model_proxy)</text>
    </g>

    <!-- Step 3: route command -->
    <g class="step3">
      <text class="code" x="24" y="286">
        <tspan class="prompt">$</tspan>
        <tspan class="cmd"> python3 -m bench_router.cli --herdr-session work route --task task.json</tspan>
      </text>
    </g>

    <!-- Step 4: route JSON output -->
    <g class="step4">
      <text class="code" x="24" y="314">{</text>
      <text class="code" x="40" y="334">
        <tspan class="cyan">"status"</tspan>: <tspan class="green">"completed"</tspan>,
        <tspan class="cyan">"selection_mode"</tspan>: <tspan class="purple">"benchmark_score"</tspan>,
      </text>
      <text class="code" x="40" y="354">
        <tspan class="cyan">"selected"</tspan>: { <tspan class="cyan">"profile"</tspan>: <tspan class="green">"codex-sol-high"</tspan>, <tspan class="cyan">"score"</tspan>: <tspan class="yellow">0.777</tspan>, <tspan class="cyan">"quality"</tspan>: <tspan class="yellow">0.852</tspan> },
      </text>
      <text class="code" x="40" y="374">
        <tspan class="cyan">"run_id"</tspan>: <tspan class="yellow">"r-synthetic-001"</tspan>,
        <tspan class="cyan">"worktree_branch"</tspan>: <tspan class="yellow">"projects/r-synthetic-001"</tspan>,
      </text>
      <text class="code" x="40" y="394">
        <tspan class="cyan">"result_file"</tspan>: <tspan class="yellow">"result.md"</tspan>,
        <tspan class="cyan">"result_sha256"</tspan>: <tspan class="dim">"6d1c04f6c831ed06...bbf9ad04d5858"</tspan>
      </text>
      <text class="code" x="24" y="414">}</text>

      <rect class="badge-bg" x="595" y="400" width="240" height="28"/>
      <text class="code green" x="610" y="419">✓ 결과 계약 및 SHA-256 검증 통과</text>
    </g>
  </g>
</svg>
