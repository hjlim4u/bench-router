[tools]
uv = "latest"
node = "lts"
"npm:codeburn" = "latest"  # eval/codeburn.py shells out to the codeburn CLI

[tasks.setup]
description = "one-stop environment setup (uv sync, default profiles/aliases, and initial public data)"
run = """
uv sync --extra arena
mkdir -p ~/.config/bench-router
[ -f ~/.config/bench-router/profiles.toml ] || cp examples/profiles.default.toml ~/.config/bench-router/profiles.toml
[ -f ~/.config/bench-router/aliases.toml ] || cp examples/aliases.example.toml ~/.config/bench-router/aliases.toml
uv run python -m bench_router.cli refresh --source mg
"""

[tasks.test]
description = "offline test suite"
run = "uv run python -m unittest test_p0 test_p1 test_p2 test_p3 test_coordination test_codeburn"

[tasks.refresh]
description = "fetch all sources and publish the routing snapshot"
depends = ["setup"]
run = "uv run python -m bench_router.cli refresh --force"

[tasks.status]
run = "uv run python -m bench_router.cli status"
