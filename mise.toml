[tools]
uv = "latest"
node = "lts"

[tasks.setup]
depends = ["install-codexbar"]
description = "one-stop environment setup (uv sync, default profiles/aliases, and initial public data)"
run = """
uv sync --extra arena
uv run bench-router init
uv run python -m bench_router.cli refresh --source mg
"""

[tasks.install]
description = "install the shared CLI and global skill instructions; rerun after git pull"
depends = ["install-codexbar", "install-cli", "install-skill"]

[tasks.install-codexbar]
description = "install the pinned, checksum-verified Linux CodexBar CLI"
run = "sh eval/install-codexbar.sh"

[tasks.install-cli]
description = "install the CLI once per user (editable, follows this clone)"
run = """
uv tool install --force --editable "$PWD[arena]"
bench-router init
"""

[tasks.install-skill]
description = "install global skill instructions only (no CLI or engine)"
run = 'npx -y skills add "$PWD" -g -a claude-code codex antigravity -y'

[tasks.test]
description = "offline test suite"
run = "uv run python -m unittest test_p0 test_p1 test_p2 test_p3 test_coordination test_codexbar test_usage test_evidence_policy"

[tasks.refresh]
description = "fetch all sources and publish the routing snapshot"
depends = ["setup"]
run = "uv run python -m bench_router.cli refresh --force"

[tasks.status]
run = "uv run python -m bench_router.cli status"

[tasks.herdr-app]
description = "Open the primary Herdr app (default core session)"
run = "sh scripts/herdr.sh app"

[tasks.herdr-tui]
description = "Open the plugin-free companion TUI; prefix+h attaches to core"
run = "sh scripts/herdr.sh tui"
