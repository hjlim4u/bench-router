# compare 평가에 쓴 프로필(config_revision v3). 로컬 profiles.toml의 사본이며 키·토큰은 없다.
schema_version = "1.0"

[[profile]]
id = "claude-default"
enabled = true
kind = "claude"
executable = "claude"
args = ["--model", "claude-opus-5-5", "--effort", "high", "--permission-mode", "auto"]
model_id = "claude-opus-5-5"
harness_id = "claude-code"
reasoning_effort = "high"
config_revision = "v3"
cost_tier = "high"
inference_local = false
context_tokens = 200000
capabilities = ["filesystem_write"]

[[profile]]
id = "codex-default"
enabled = true
kind = "codex"
executable = "codex"
args = ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=\"high\"", "-s", "workspace-write", "-a", "never"]
model_id = "gpt-6.1-sol"
harness_id = "codex-cli"
reasoning_effort = "high"
config_revision = "v3"
cost_tier = "high"
inference_local = false
context_tokens = 200000
capabilities = ["filesystem_write"]

[[profile]]
id = "agy-default"
enabled = true
kind = "agy"
executable = "agy"
args = ["--model", "gemini-4-argon-medium"]
model_id = "gemini-4-argon"
harness_id = "antigravity-cli"
reasoning_effort = "medium"
config_revision = "v3"
cost_tier = "medium"
inference_local = false
context_tokens = 1000000
capabilities = ["filesystem_write"]
