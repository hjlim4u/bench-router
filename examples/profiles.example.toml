# 비활성 placeholder입니다. 실제 CLI/model/version/계정을 검증한 뒤 변경하세요.
schema_version = "1.0"
default_profile = "local-codex-example"
fallback_order = ["local-codex-example"]

[[profile]]
id = "local-codex-example"
enabled = false
kind = "codex"
executable = "codex"
