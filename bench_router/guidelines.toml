# Per-model effort recommendations ("The per-model recommendations that follow override this table where they differ.").
[[vendor.claude.start]]
model = "claude-fable-5-1"
effort = "high"
when = "Start with `high`, the default."
[[vendor.claude.start]]
model = "claude-opus-5-5"
effort = "medium"
when = "Claude Opus 5.5 supports all five effort levels, and `medium` is the default. Claude Opus 5 and earlier Opus models default to `high`, so a request that omits `effort` runs one level lower on Claude Opus 5.5. Adaptive thinking is always on and can’t be turned off, so effort is the primary control for how much the model reasons and what a request costs."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "high"
when = "Start with `high` unless your workload is agentic or latency-sensitive. For agentic coding and multistep tool use, start with `medium` for well-specified tasks and move to `high` for harder or longer ones."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "medium"
when = "For agentic coding and multistep tool use, start with `medium` for well-specified tasks and move to `high` for harder or longer ones. For chat and other latency-sensitive work, start with `medium` or `low`. At `low` and `medium`, on long agentic tasks, it's more likely to stop and check in with the user before it completes its work."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "low"
when = "For chat and other latency-sensitive work, start with `medium` or `low`. At `low`, it keeps its thinking short and can skip verifying a change."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "medium"
when = "Start with `medium` for most work, including agentic coding."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "low"
when = "Use `low`, the cheapest and fastest level, for chat, short tool tasks, and simple, high-volume requests. In long agent prompts, the model is more likely to skip a search, stop early, or skip a check at this level."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "high"
when = "Use `high` for knowledge work, longer agent tasks, and strict instruction following. When instruction following matters most, also use `high` effort."

[[vendor.claude.escalation]]
model = "claude-fable-5-1"
efforts = ["xhigh", "max", "medium", "low"]
when = "Step up to `xhigh` or `max` for the most capability-sensitive agentic and coding work, and step down to `medium` or `low` for routine or latency-sensitive work once your evals show quality holds. At `medium`, results roughly match Claude Fable 5 at lower cost, so step down to `medium` or `low` where your evals show quality holds."
[[vendor.claude.escalation]]
model = "claude-opus-5-5"
efforts = ["low", "high", "xhigh", "max"]
when = "Run an effort sweep on your own evals rather than carrying settings over from an earlier model. Reserve `xhigh` and `max` for work where you've measured a quality gain."
[[vendor.claude.escalation]]
model = "claude-sonnet-5-5"
efforts = ["xhigh", "max"]
when = "Use `xhigh` or `max` only where your evals show a quality gain. Reserve `xhigh` and `max` for work where you've measured a quality gain, because thinking and replies get much longer there."
[[vendor.claude.escalation]]
model = "claude-haiku-5-5"
efforts = ["xhigh", "max"]
when = "Use `xhigh` or `max` only where your evals show a quality gain, and compare them with Claude Sonnet 5.5 on performance, cost, and speed."


[[vendor.claude.start]]
model = "claude-fable-5-2"
effort = "low"
when = "`low` suits quick back-and-forth, well-specified tasks, and high-volume workloads (intelligent and fast subagents, for example). On coding evaluations, Claude Fable 5.2 performs better than past models at `low` effort. In Anthropic\u2019s testing, it scored close to what Claude Fable 5.1 did at higher effort."
[[vendor.claude.start]]
model = "claude-fable-5-2"
effort = "medium"
when = "`medium` suits interactive coding, chat, and everyday knowledge work."
[[vendor.claude.start]]
model = "claude-fable-5-2"
effort = "high"
when = "Start at `high`, the default for Claude Fable 5.2 on the Claude API. `high` suits hard coding, research, agentic work, and long unattended runs. Turns take noticeably longer to finish than at `medium`."
[[vendor.claude.escalation]]
model = "claude-fable-5-2"
efforts = ["xhigh"]
when = "`xhigh` is for your hardest long-running coding and agentic work where you\u2019ve measured a gain. It raised scores slightly on Anthropic\u2019s internal coding evaluations and used many more tokens."
[[vendor.claude.escalation]]
model = "claude-fable-5-2"
efforts = ["max"]
when = "`max` is for measuring the model\u2019s ceiling or for the rare task where time and tokens don\u2019t matter. It is most reasonable to use `max` for open-ended problems such as scientific discovery and mathematics. Turns are slow and use many more tokens than at `xhigh`."

[vendor.gemini]
revision = "2026-11-26.1"
sources = ["gemini_models", "gemini_thinking", "gemini_choosing_a_model", "gemini_whats_new_neon"]
strategy = "Start with `high` for most complex tasks, and reserve `xhigh` for hard, multi-step problems where `high` falls short. Using `xhigh` increases latency and token use and can cause overthinking or exhaust `max_output_tokens` on simpler prompts such as text or JSON extraction. Run your evaluations at all four levels with a high `max_output_tokens` so the limit doesn’t cut answers short, then pick the lowest `thinking_level` that meets your quality bar."

