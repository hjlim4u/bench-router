[vendor.claude]
revision = "2026-10-24.2"
sources = ["claude_models", "claude_effort", "claude_prompting_fable_5_1", "claude_prompting_opus_5_5", "claude_prompting_sonnet_5_5", "claude_prompting_haiku_5_5"]
strategy = "Most workloads start with Claude Opus 5.5. Start efficiency-first: For many applications, starting with a faster, more cost-effective model such as Claude Haiku 5.5 can be the optimal approach (best for: Initial prototyping and development; Applications with tight latency requirements; Cost-sensitive implementations; High-volume, straightforward tasks). Start capability-first: For complex tasks where intelligence and advanced capabilities are paramount, you might want to start capability-first (best for: Complex reasoning tasks; Scientific or mathematical applications; Tasks requiring nuanced understanding; Applications where accuracy outweighs cost considerations; Advanced coding and high-autonomy agentic work). Tuning effort is often a better lever than switching models."

# Model selection matrix: "When you need..." / "Example use cases".
[[vendor.claude.model]]
id = "claude-fable-5-1"
role = "The highest available capability. Agent sessions that run for hours, multistep deep research, analysis carried through to a finished document, spreadsheet, or deck"
[[vendor.claude.model]]
id = "claude-opus-5-5"
role = "Complex agentic coding and enterprise work. Multihour autonomous coding agents, large-scale refactoring, complex systems engineering, vision-heavy workflows, computer use"
[[vendor.claude.model]]
id = "claude-sonnet-5-5"
role = "Speed and capability for everyday coding, agent, and enterprise workloads. Code generation, data analysis, content creation, visual understanding, agentic tool use"
[[vendor.claude.model]]
id = "claude-haiku-5-5"
role = "The lowest latency and price. Real-time applications, high-volume intelligent processing, cost-sensitive deployments needing strong reasoning, subagent tasks"

# Per-model effort recommendations ("The per-model recommendations that follow override this table where they differ.").
[[vendor.claude.start]]
model = "claude-fable-5-1"
effort = "high"
when = "Start with `high`, the default."
[[vendor.claude.start]]
model = "claude-opus-5-5"
effort = "medium"
when = "Claude Opus 5.5 supports all five effort levels, and `medium` is the default."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "high"
when = "Start with `high` unless your workload is agentic or latency-sensitive. For agentic coding and multistep tool use, start with `medium` for well-specified tasks and move to `high` for harder or longer ones."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "medium"
when = "For agentic coding and multistep tool use, start with `medium` for well-specified tasks and move to `high` for harder or longer ones. For chat and other latency-sensitive work, start with `medium` or `low`. At `low` and `medium`, on long agentic tasks, it's more likely to stop and check in with the user before it completes its work."
[[vendor.claude.start]]
model = "claude-sonnet-5-5"
effort = "low"
when = "For chat and other latency-sensitive work, start with `medium` or `low`. At `low`, it keeps its thinking short and can skip verifying a change."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "medium"
when = "Start with `medium` for most work, including agentic coding."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "low"
when = "Use `low`, the cheapest and fastest level, for chat, short tool tasks, and simple, high-volume requests. In long agent prompts, the model is more likely to skip a search, stop early, or skip a check at this level."
[[vendor.claude.start]]
model = "claude-haiku-5-5"
effort = "high"
when = "Use `high` for knowledge work, longer agent tasks, and strict instruction following. When instruction following matters most, also use `high` effort."

[[vendor.claude.escalation]]
model = "claude-fable-5-1"
efforts = ["xhigh", "max", "medium", "low"]
when = "Step up to `xhigh` or `max` for the most capability-sensitive agentic and coding work, and step down to `medium` or `low` for routine or latency-sensitive work once your evals show quality holds. At `medium`, results roughly match Claude Fable 5 at lower cost, so step down to `medium` or `low` where your evals show quality holds."
[[vendor.claude.escalation]]
model = "claude-opus-5-5"
efforts = ["low", "high", "xhigh", "max"]
when = "Run an effort sweep on your own evals rather than carrying settings over from an earlier model. Reserve `xhigh` and `max` for work where you've measured a quality gain."
[[vendor.claude.escalation]]
model = "claude-sonnet-5-5"
efforts = ["xhigh", "max"]
when = "Use `xhigh` or `max` only where your evals show a quality gain. Reserve `xhigh` and `max` for work where you've measured a quality gain, because thinking and replies get much longer there."
[[vendor.claude.escalation]]
model = "claude-haiku-5-5"
efforts = ["xhigh", "max"]
when = "Use `xhigh` or `max` only where your evals show a quality gain, and compare them with Claude Sonnet 5.5 on performance, cost, and speed."

