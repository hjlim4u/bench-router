[vendor.openai]
revision = "2026-10-26.1"
sources = ["openai"]
strategy = "If cost and latency aren’t a concern, you can default to Astra. To reduce costs or latency, use the guidance below to choose a model and reasoning effort for your needs. If you can, experiment using the same inputs to compare results and keep the lightest setting that meets your quality bar."

# Interactive recommendation inputs are context, not invented task descriptions.
