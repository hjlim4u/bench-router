# Extraction from each vendor's official pages; selection passages rechecked 2026-10-26 in Windows Ego.
# Every `strategy`, `role`, `when` text is quoted from that vendor's own page only; never mix vendors.
# No prefix matching or cross-version aliases. These are model IDs, not CLI flags.
# `start` rows: (model, effort) starting points as the guide states them. `escalation` rows: effort changes the
# guide makes conditional on evaluation or a step from the start, never starting points themselves.
# `prompt_guidance` rows quote the vendor's own prompting guides for the selected model (output only; they never
# take part in selection or hashes). `when` is verbatim page text; `text` is the prompt snippet the page supplies.
# Gemini gives model roles and a model-independent thinking rule (`effort_class`), resolved per model from
# that page's `default`/`supported` levels.
