# Versioned policy extraction from the wiki, not an automatic wiki compilation.
# No prefix matching or cross-version aliases. These are model IDs, not CLI flags.
version = "2026-10-24.1"
as_of = "2026-10-19"

[sources.openai]
url = "https://developers.openai.com/api/docs/guides/model-selection"
wiki = "references/sources/openai-model-selection.md"
[sources.claude_models]
url = "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"
wiki = "references/sources/anthropic-model-selection.md"
[sources.claude_effort]
url = "https://platform.claude.com/docs/en/build-with-claude/effort"
wiki = "references/sources/anthropic-effort.md"
[sources.gemini_models]
url = "https://ai.google.dev/gemini-api/docs/models"
wiki = "references/sources/google-gemini-models.md"
[sources.gemini_thinking]
url = "https://ai.google.dev/gemini-api/docs/thinking"
wiki = "references/sources/google-gemini-thinking.md"

[[model]]
id = "gpt-6-luna"
vendor = "openai"
revision = "2026-10-19.1"
sources = ["openai"]
role = "Bounded edits, extraction and scoped problem solving; context gathering and prioritization at higher effort."
[model.efforts]
low = "Small edits, extraction, bounded problems."
xhigh = "Context gathering across apps, prioritization and constrained problem solving."

[[model]]
id = "gpt-6.1-sol"
vendor = "openai"
revision = "2026-10-19.1"
sources = ["openai"]
role = "Complex technical projects and deliverables."
[model.efforts]
medium = "Technical projects where further revisions are expected."
xhigh = "Polished deliverables and reconciliation of conflicting evidence."

[[model]]
id = "gpt-6-astra"
vendor = "openai"
revision = "2026-10-19.1"
sources = ["openai"]
role = "Nuanced writing, broad projects and demanding analysis."
[model.efforts]
low = "Brief writing that preserves nuance."
medium = "Broad ambitious projects requiring dependable interactions."
xhigh = "Demanding analysis with exacting output requirements."

[[model]]
id = "claude-haiku-5-5"
vendor = "claude"
revision = "2026-10-19.1"
evaluation_only_efforts = ["xhigh", "max"]
sources = ["claude_models", "claude_effort"]
role = "Budget-sensitive high-volume processing and subagent work; upgrade for demonstrated capability gaps."
[model.efforts]
low = "Short simple tool tasks and latency-sensitive requests; risk of skipped steps in long workflows."
medium = "Starting point for most work, including agentic coding."
high = "Knowledge work, longer agent tasks and strict instruction following."
xhigh = "Use only when workflow evaluations show a quality gain."
max = "Use only when workflow evaluations show a quality gain."

[[model]]
id = "claude-sonnet-5-5"
vendor = "claude"
revision = "2026-10-19.1"
evaluation_only_efforts = ["xhigh", "max"]
sources = ["claude_models", "claude_effort"]
role = "Everyday coding, analysis and tool-based workflows."
[model.efforts]
medium = "Clearly specified coding and tool workflows."
high = "Harder or longer coding and tool workflows."
xhigh = "Use only when workflow evaluations show improvement."
max = "Use only when workflow evaluations show improvement."

[[model]]
id = "claude-opus-5-5"
vendor = "claude"
revision = "2026-10-19.1"
sources = ["claude_models", "claude_effort"]
role = "Complex engineering, large refactors and extended autonomous sessions."
[model.efforts]
medium = "Default starting point; evaluate effort settings afresh for this model."
high = "Raise after evaluation when the workflow needs more capability."

[[model]]
id = "claude-fable-5-1"
vendor = "claude"
revision = "2026-10-19.1"
sources = ["claude_models", "claude_effort"]
role = "Most demanding long-running agentic research and finished knowledge deliverables."
[model.efforts]
medium = "Step down only after evaluations show quality holds."
high = "Starting point; raise for demanding work or lower only when quality holds in evaluations."
xhigh = "Raise for capability-sensitive long-running agentic or coding work."

[[model]]
id = "gemini-3.5-flash-lite"
vendor = "gemini"
revision = "2026-10-19.1"
sources = ["gemini_models", "gemini_thinking"]
role = "Economical high-throughput execution."
[model.efforts]
minimal = "Default; simple fact retrieval or classification."
low = "Simple fact retrieval or classification."
medium = "Supported; use the model default unless a task-specific evaluation supports another level."
high = "Highest supported thinking for advanced coding, mathematics or multistep planning."

[[model]]
id = "gemini-3.8-flash"
